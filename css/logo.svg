<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f766e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Square background with rounded corners (same frame as the atem / edm logos;
       teal instead of their blue so the CORA tab / header icon stands apart) -->
  <rect x="0" y="0" width="200" height="200" rx="24" ry="24" fill="url(#bgGrad)" />

  <!-- Benefit shield: the corporate entitlement Alpro administers -->
  <path d="M100 30 L146 46 V82 C146 108 127 126 100 136 C73 126 54 108 54 82 V46 Z" fill="#ffffff" />

  <!-- Pharmacy cross inside the shield -->
  <rect x="90" y="56" width="20" height="56" rx="4" fill="#0f766e" />
  <rect x="72" y="74" width="56" height="20" rx="4" fill="#0f766e" />

  <!-- Approval badge: the claim checked and approved -->
  <circle cx="142" cy="118" r="20" fill="#0f766e" stroke="#ffffff" stroke-width="5" />
  <polyline points="133,118 140,125 152,111" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Divider line -->
  <line x1="30" y1="148" x2="170" y2="148" stroke="#ffffff" stroke-width="1" opacity="0.25" />

  <!-- CORA wordmark -->
  <text
    x="100"
    y="178"
    text-anchor="middle"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="36"
    font-weight="700"
    letter-spacing="6"
    fill="#ffffff"
  >CORA</text>
</svg>
